name: StaffChat
version: ${version}
main: com.staffchat.StaffChat
api-version: 1.21
description: A Paper plugin that adds a staff chat feature with LuckPerms integration and Discord webhook support. Includes commands /staffchat and /sc for restricted staff communication.
author: Your Name
website: https://github.com/yourusername/staffchat

depend: [LuckPerms]
softdepend: []

commands:
  staffchat:
    description: Toggle staff chat mode or send a message to staff chat
    usage: /<command> [message]
    aliases: [sc]
    permission: staffchat.use
  chat:
    description: Switch between normal and staff chat modes
    usage: /<command> <normal|staff>
    permission: staffchat.use

permissions:
  staffchat.use:
    description: Allows using staff chat commands
    default: op
  staffchat.admin:
    description: Allows administrative staff chat functions
    default: op
