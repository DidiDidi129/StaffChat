plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'maven-publish'
}

group = project.maven_group
version = project.mod_version
description = 'StaffChat plugin for Paper servers'

repositories {
    mavenCentral()
    maven {
        name = "PaperMC"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "LuckPerms"
        url = "https://repo.lucko.me/"
    }
    maven {
        name = "Sonatype Snapshots"
        url = "https://oss.sonatype.org/content/repositories/snapshots"
    }
}

dependencies {
    // Paper API
    compileOnly "io.papermc.paper:paper-api:${project.paper_version}"
    
    // LuckPerms API
    compileOnly "net.luckperms:api:5.4"

    // HTTP Client for Discord webhooks
    implementation "com.google.code.gson:gson:2.10.1"
    
    // Discord bot (JDA)
    implementation "net.dv8tion:JDA:5.2.1"
    // JDA's dependencies are included transitively
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = targetJavaVersion
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    classifier = null
    relocate 'com.google.gson', 'staffchat.libs.gson'
    relocate 'net.dv8tion.jda', 'staffchat.libs.jda'
    relocate 'com.squareup.okhttp3', 'staffchat.libs.okhttp3'
    relocate 'com.squareup.okio', 'staffchat.libs.okio'
    relocate 'org.jetbrains.kotlin', 'staffchat.libs.kotlin'
    relocate 'com.neovisionaries', 'staffchat.libs.nv'
    relocate 'net.sf.trove4j', 'staffchat.libs.trove4j'
    relocate 'com.fasterxml.jackson', 'staffchat.libs.jackson'
    relocate 'org.apache.commons.collections4', 'staffchat.libs.commons'
}

build.dependsOn shadowJar

jar {
    classifier = 'original'
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}